name: coupang check
on:
  schedule:
        - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
            - run: pip install requests beautifulsoup4
            - run: python monitor.py
